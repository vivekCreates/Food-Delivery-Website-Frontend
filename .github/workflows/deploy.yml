name: Deploy Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Check Out Repo
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Docker Image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: vivek60631/tomato:latest

      # Verify Pushed Image
      - name: Verify Pushed Image
        run: docker pull vivek60631/tomato:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull vivek60631/tomato:latest

            sudo docker stop food-app || true
            sudo docker rm food-app || true

            sudo docker run -d \
              --name food-app \
              -p 3000:3000 \
              vivek60631/tomato:latest